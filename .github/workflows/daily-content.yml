name: Daily affiliate content
on:
  schedule:
    - cron: '15 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-affiliate-content
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Draft one informational guide
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
        run: node scripts/generate-post.mjs
      - name: Publish generated guide
        run: |
          if git diff --quiet -- posts.json; then
            echo "No new guide to publish. Check that products.json has an approved affiliate URL."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts.json
          git commit -m "Publish daily baking tools guide"
          git push
